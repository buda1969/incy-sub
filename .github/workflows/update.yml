name: Update subscriptions

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: update-subscriptions
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build subscriptions
        run: python scripts/update.py

      - name: Validate output
        run: |
          test -s mobile.txt
          test -s full.txt
          test -s status.json
          test -s node_history.json
          grep -q '^vless://' mobile.txt
          grep -q '^vless://' full.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add mobile.txt full.txt status.json node_history.json
          if [ -f backup.txt ]; then
            git add backup.txt
          fi

          if git diff --cached --quiet; then
            echo "Изменений нет"
          else
            git commit -m "Update stable INCY subscriptions"
            git push origin HEAD:main
          fi
